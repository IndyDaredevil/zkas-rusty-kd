name: Build and upload assets
on:
  release:
    types: [ published ]

# The default GITHUB_TOKEN is read-only, so action-gh-release cannot attach
# assets ("Resource not accessible by integration"). Grant write to releases.
permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest = Apple Silicon (arm64); macos-15-intel = Intel (x86_64) so Intel Macs get a
        # working build. NB: `macos-13` was GitHub's Intel image and has been retired — a job asking
        # for it queues forever instead of failing, which is why zkas-v1.0.1 shipped without an
        # Intel-macOS archive (4 of 5 build jobs succeeded; that one sat queued for 16h).
        os: [ ubuntu-latest, windows-latest, macos-latest, macos-15-intel ]
    name: Building, ${{ matrix.os }}
    steps:
      - name: Fix CRLF on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Checkout sources
        uses: actions/checkout@v3

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Build Outputs
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}


      - name: Build on Linux
        if: runner.os == 'Linux'
        # We're using musl to make the binaries statically linked and portable
        run: |
          # Run build script for musl toolchain
          source musl-toolchain/build.sh
          
          # Go back to the workspace
          cd $GITHUB_WORKSPACE
          
          # Build non-bridge binaries first (ZKas node + shielded wallet + miner + explorer API)
          cargo --verbose build --locked --bin kaspad --bin zkas-miner --bin zkas-walletd --bin zkas-api --bin shielded-pay --release --target x86_64-unknown-linux-musl
          # Build bridge with allow-multiple-definition to resolve mimalloc/libstdc++ symbol collisions.
          # musl-toolchain/build.sh sets RUSTFLAGS directly, so we append this flag here explicitly.
          export RUSTFLAGS="$RUSTFLAGS -C link-arg=-Wl,--allow-multiple-definition"
          cargo --verbose build --locked --bin stratum-bridge --release --target x86_64-unknown-linux-musl
          mkdir bin || true
          cp target/x86_64-unknown-linux-musl/release/kaspad bin/
          cp target/x86_64-unknown-linux-musl/release/zkas-miner bin/
          cp target/x86_64-unknown-linux-musl/release/zkas-walletd bin/
          cp target/x86_64-unknown-linux-musl/release/zkas-api bin/
          cp target/x86_64-unknown-linux-musl/release/shielded-pay bin/
          cp target/x86_64-unknown-linux-musl/release/stratum-bridge bin/
          cp docs/RELEASE_README.txt bin/README.txt
          archive="bin/zkas-${{ github.event.release.tag_name }}-linux-amd64.zip"
          zip -r "${archive}" ./bin/*
          echo "archive=${archive}" >> $GITHUB_ENV

      # ---------------------------------------------------------------------
      # FALLBACK (proven 2026-07-16, shipped as v0.3.0): if this CI job can't
      # run, cross-compile from Linux with MinGW. This exact recipe produced
      # 6/6 clean exes (full details: docs/BUILDING-WINDOWS.md):
      #
      #   apt install gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
      #   rustup target add x86_64-pc-windows-gnu
      #   mkdir -p /root/work/winlibs
      #   cp /usr/lib/gcc/x86_64-w64-mingw32/13-posix/libstdc++.a /root/work/winlibs/
      #   # linker + rustflags come from the committed .cargo/config.toml:
      #   #   [target.x86_64-pc-windows-gnu]
      #   #   linker = "x86_64-w64-mingw32-g++-posix"
      #   #   rustflags = ["-Clink-arg=-static", "-Clink-arg=-static-libstdc++",
      #   #                "-Clink-arg=-static-libgcc", "-L", "/root/work/winlibs"]
      #   # (winlibs holds ONLY libstdc++.a so librocksdb-sys's -lstdc++ cannot
      #   #  resolve to the libstdc++-6.dll import lib. Do NOT set the
      #   #  CARGO_TARGET_..._RUSTFLAGS env var — it overrides this config.)
      #   nice -n 19 cargo build -j 2 --release --target x86_64-pc-windows-gnu \
      #     --bin kaspad --bin zkas-miner --bin zkas-walletd --bin zkas-api --bin shielded-pay --bin stratum-bridge
      #
      #   # MANDATORY gate before zipping — every exe must print CLEAN:
      #   for f in target/x86_64-pc-windows-gnu/release/*.exe; do
      #     x86_64-w64-mingw32-objdump -p "$f" | grep -i "DLL Name" \
      #       | grep -qiE "libstdc|libgcc|winpthread" && echo "DIRTY: $f" || echo "CLEAN: $f"
      #   done
      #
      #   # package: folder zkas-windows-x86_64-<tag>/ with the exes + RUN-WINDOWS.txt, then:
      #   zip -r zkas-windows-x86_64-<tag>.zip zkas-windows-x86_64-<tag>
      #   gh release upload <tag> zkas-windows-x86_64-<tag>.zip --clobber -R zkas/zkas-rusty
      # ---------------------------------------------------------------------
      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --locked --bin kaspad --release
          cargo build --locked --bin zkas-miner --release
          cargo build --locked --bin zkas-walletd --release
          cargo build --locked --bin zkas-api --release
          cargo build --locked --bin shielded-pay --release
          cargo build --locked --bin stratum-bridge --release
          mkdir bin || true
          cp target/release/kaspad.exe bin/
          cp target/release/zkas-miner.exe bin/
          cp target/release/zkas-walletd.exe bin/
          cp target/release/zkas-api.exe bin/
          cp target/release/shielded-pay.exe bin/
          cp target/release/stratum-bridge.exe bin/
          cp docs/RELEASE_README.txt bin/README.txt
          archive="bin/zkas-${{ github.event.release.tag_name }}-win64.zip"
          powershell "Compress-Archive bin/* \"${archive}\""
          echo "archive=${archive}" >> $GITHUB_ENV

      - name: Build on MacOS
        if: runner.os == 'macOS'
        # Pin the deployment target, or the binary only runs on the runner's own macOS.
        #
        # Without this the toolchain links against whatever libc++ the runner ships — macos-15-intel
        # is Sequoia — and the result aborts at launch on any older Mac with
        # `dyld: Symbol not found: __ZNSt3__117bad_function_callD1Ev ... Expected in
        # /usr/lib/libc++.1.dylib`. That symbol is a libc++ (C++ runtime) export, pulled in by the
        # C++ dependencies (RocksDB), so it bites even though this is a Rust project. Reported by an
        # operator on the v1.0.5 Intel build.
        #
        # 10.13 on Intel covers essentially every Intel Mac still running; arm64 cannot go below
        # 11.0 because Apple Silicon did not exist before it.
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.os == 'macos-15-intel' && '10.13' || '11.0' }}
        run: |
          echo "building with MACOSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET on $(uname -m)"
          cargo build --locked --bin kaspad --release
          cargo build --locked --bin zkas-miner --release
          cargo build --locked --bin zkas-walletd --release
          cargo build --locked --bin zkas-api --release
          cargo build --locked --bin shielded-pay --release
          cargo build --locked --bin stratum-bridge --release
          mkdir bin || true
          cp target/release/kaspad bin/
          cp target/release/zkas-miner bin/
          cp target/release/zkas-walletd bin/
          cp target/release/zkas-api bin/
          cp target/release/shielded-pay bin/
          cp target/release/stratum-bridge bin/
          cp docs/RELEASE_README.txt bin/README.txt
          # arch-tagged so the arm64 (macos-latest) and x86_64 (macos-15-intel) archives don't collide.
          archive="bin/zkas-${{ github.event.release.tag_name }}-osx-$(uname -m).zip"
          zip -r "${archive}" ./bin/*
          echo "archive=${archive}" >> $GITHUB_ENV

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ./${{ env.archive }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # build-wasm job removed 2026-08-31: it shipped upstream Kaspa's JS SDK, which nothing
  # in the ZKas ecosystem consumes (the wallet has its own signer wasm), and the
  # getrandom-0.3 wasm_js migration broke it. Restore from git history if the JS SDK is wanted.
