# ===========================================================================
# Prometheus — KDSM mining stack (Kron K1)
#
# DEPLOYED COPY lives in Prometheus's own config directory on the Kron.
# Find it authoritatively: http://localhost:9090/status -> Command-Line Flags
# -> --config.file. alert_rules.yml resolves RELATIVE to this file's
# directory, so the two must sit together.
#
# This file is a MIRROR for docs/bridge-v2/monitoring/. Edit the live copy,
# then sync. Never edit the repo copy expecting it to take effect.
#
# Revision 2026-08-18:
#   - scrape_timeout 12s -> 14s. Measured: max scrape duration was
#     12.001298s against a 12s timeout — the ceiling, not headroom. 33 of
#     1918 scrapes in 8h failed, producing 33 staleness gaps in every
#     ks_* counter series (1885 samples vs 1918 attempts, identical on all
#     seven workers). Those gaps are what fired the phantom alert storm;
#     see the scrape_timeout comment below and the BLOCK EVENTS note in
#     alert_rules.yml. Mitigation only — the 12s /metrics render is
#     bridge-side and belongs on the v2.0.1.4 punch list.
#
# Revision 2026-08-10:
#   - REVERTED the ip port-strip metric_relabel added 08-09. Stripping the
#     port collapsed each worker's retired and live session series into one
#     labelset within a single scrape; Prometheus kept whichever appeared
#     first in exposition order and discarded the rest. It kept the zeroes.
#
#     Symptoms, all one cause: four phantom "Rig silent on the RC" alerts
#     (w1m/w7m/w8m/w9m — exactly the four workers that had reconnected);
#     rc:kas_24h = 7 against a true 54; rc:rig_ths = 1.00 TH/s against a
#     true 15.27; restart K/Z/D = 0/0/0; and a card printing DOUBLE 44 >
#     KAS 7, which is structurally impossible.
#
#     VERIFIED after this revert: sum(ks_blocks_mined) = 145, matching
#     count(ks_mined_blocks_gauge) = 145. Two independent metric families
#     — one per-worker, one per-block — agreeing. They read 14 vs 145
#     before. Allow ~5 min after reload for the stale port-stripped series
#     to leave the staleness window; a transitional reading is old + new
#     (159), not a failure.
#
#     The series-churn problem the relabel was written to solve is real
#     (unbounded cardinality; breaks any per-series zero test) and is now
#     handled in PromQL by aggregating ip away AFTER ingest, until the
#     bridge-side fix lands.
#
# Revision 2026-08-09:
#   - REMOVED the zkas_merged_bridge (:3033) job. The fleet cut over to the
#     RC; that bridge has been down, its scrape has been failing silently,
#     and its stale gauge was the fallback source for the zKAS network
#     hashrate. Removing the job removes the possibility of it silently
#     taking that number back over. If you deliberately bring :3033 back,
#     re-add the job AND settle the "*10 or not" question before any rule
#     reads its gauge again.
# ===========================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  # Punch-list item from the 08-05 overnight soak: the bridge's dashboard
  # port can answer /metrics slowly while it is busy with template work;
  # give scrapes most of the interval before declaring the target dead.
  #
  # 2026-08-18: RAISED 12s -> 14s. The 12s was not "generous headroom", it
  # was the ceiling being hit:
  #   max_over_time(scrape_duration_seconds{job="rc_merged_bridge"}[8h])
  #     = 12.001298s  <- killed by the timeout, not a natural maximum
  #   count_over_time(up[8h])                     = 1918 attempts
  #   count_over_time(ks_double_blocks_mined[8h]) = 1885 samples, all 7 workers
  #     -> 33 missing samples, matching 33 up==0 buckets EXACTLY.
  #
  # Every failed scrape writes a staleness marker, and a staleness marker
  # terminates lookback. Any rule reading `<counter> offset <w>` across one
  # therefore resolves to EMPTY while the live counter is nonzero — which
  # is what fired the 2026-08-18 phantom alert storm (see the BLOCK EVENTS
  # note in alert_rules.yml). One failed scrape is sufficient; no outage,
  # no restart, and no bridge fault is required. RcBridgeDown never left
  # `pending` through all 33, so nothing surfaced it.
  #
  # 14s is MITIGATION, not the fix, and it is the hard ceiling: scrape_timeout
  # must stay <= scrape_interval. A /metrics handler taking 12 seconds to
  # render ~70 series is the real defect and is bridge-side.
  scrape_timeout: 14s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - localhost:9093

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          app: "prometheus"

  # RC v2.1 merged bridge (:3034) — PRODUCTION. In-tree zkas-rusty v2
  # stratum core, KAS-primary with zKAS merged via AuxPoW.
  - job_name: 'rc_merged_bridge'
    static_configs:
      - targets: ["localhost:3034"]
    metric_relabel_configs:
      # ---------------------------------------------------------------------
      # DO NOT STRIP THE PORT FROM `ip` HERE. Removed 2026-08-10.
      #
      # The RC exports ip as host:port, and the ephemeral source port changes
      # on every reconnect. The obvious fix — rewrite ip to just the host so a
      # reconnect "reuses" the series — is wrong, because the RC NEVER RETIRES
      # the old session's series. Both are present in the SAME scrape:
      #
      #   ks_blocks_mined{ip="192.168.1.27:36754", miner="", worker="w7m"}  0
      #   ks_blocks_mined{ip="192.168.1.27:36756", miner="", worker="w7m"} 40
      #
      # Strip the port and those become identical labelsets in one scrape.
      # That is a duplicate, not a continuation: Prometheus keeps whichever
      # comes first in exposition order and silently discards the rest. On
      # 2026-08-10 it kept the ZEROES for w1m/w7m/w8m/w9m — the four workers
      # that had reconnected — which produced:
      #   - four phantom "Rig silent on the RC" alerts,
      #   - rc:kas_24h = 7 against a true 54,
      #   - rc:rig_ths = 1.00 TH/s against a true 15.27,
      #   - restart K/Z/D = 0/0/0,
      #   - a card printing DOUBLE 44 > KAS 7, which is structurally
      #     impossible (a double IS a KAS block, so D <= min(K,Z)).
      # ZKAS and DOUBLE read correctly only because those metric families
      # happened to expose the live series first. Same defect, opposite coin
      # flip.
      #
      # Series churn from the port is a REAL problem — it is an unbounded
      # cardinality leak and it breaks any per-series zero test. Handle it in
      # PromQL instead, by aggregating ip away AFTER ingest:
      #   sum by (worker) (increase(ks_valid_share_diff_counter[15m]))
      #   sum by (worker) (max by (worker, ip) (ks_blocks_mined))
      # The retired session's series contributes increase()=0 and its frozen
      # counter value, both of which are correct in a sum.
      #
      # REAL FIX is bridge-side: drop `ip` from the counter label sets
      # entirely (worker already identifies the rig on a loopback fleet), or
      # de-register a worker's series on disconnect. WS3 punch list, next to
      # the warm-up label-context fix.
      # ---------------------------------------------------------------------

      # The RC's warm-up zero-init registers a SECOND series per worker
      # carrying miner="IceRiverMiner-v1.1" (all zeros, forever); the live
      # counting path rides miner="". With labeldrop alone those two
      # collapse into identical labelsets and Prometheus keeps whichever
      # came first in exposition order — silently. Drop the warm-up
      # duplicates BEFORE the labeldrop so the collision can't happen.
      # (Real fix is bridge-side: warm-up should init in the same label
      # context the counting path uses — punch list.)
      #
      # NOTE: this pair is safe ONLY because ip still carries the port and
      # therefore still distinguishes sessions. If you ever remove ip, the
      # collision this prevents comes back in a different shape.
      - source_labels: [miner]
        regex: "IceRiverMiner.*"
        action: drop
      - action: labeldrop
        regex: "miner"

  # =========================================================================
  # zKAS reporter sidecar (:9151) — ADDED 2026-08-21.
  # The dashboard block feed's reporting process (C:\zkas\zkas-reporter.ps1,
  # ZkasReporter scheduled task). Loopback-only HttpListener; requires a
  # one-time elevated URL ACL:
  #   netsh http add urlacl url=http://127.0.0.1:9151/ user=inmyh
  # Three series: zkas_reporter_blocks_total, zkas_reporter_pending,
  # zkas_reporter_post_failures_total. Served inside the reporter's main
  # loop, so a wedged loop fails the scrape exactly like a dead process —
  # `up` on this job covers both (see the zkas_reporter alert group).
  # No timing coupling to the bridge job's scrape_timeout tuning: this
  # target renders 3 series in microseconds.
  # =========================================================================
  - job_name: 'zkas_reporter'
    static_configs:
      - targets: ["127.0.0.1:9151"]
